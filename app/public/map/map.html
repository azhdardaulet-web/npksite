  // ---------- sphere math ----------
  _proj(lng,lat){
    const V=this.view, D=this.D2R;
    const lr=(lng-V.lambda)*D, la=lat*D;
    const cl=Math.cos(la);
    const x0=cl*Math.cos(lr), y0=cl*Math.sin(lr), z0=Math.sin(la);
    const cp=Math.cos(V.phi*D), sp=Math.sin(V.phi*D);
    const x1=x0*cp+z0*sp, y1=y0, z1=-x0*sp+z0*cp;
    const cg=Math.cos(V.gamma*D), sg=Math.sin(V.gamma*D);
    const rx=x1, ry=y1*cg-z1*sg, rz=y1*sg+z1*cg;
    return {sx:V.cx+V.R*ry, sy:V.cy-V.R*rz, rx, ry, rz, v:rx>=0};
  }
  _unproj(px,py){
    const V=this.view, D=this.D2R;
    const Ry=(px-V.cx)/V.R, Rz=-(py-V.cy)/V.R;
    const r2=Ry*Ry+Rz*Rz; if(r2>1) return null;
    const cg=Math.cos(V.gamma*D), sg=Math.sin(V.gamma*D);
    const y1=Ry*cg+Rz*sg, z1=-Ry*sg+Rz*cg;
    const x1=Math.sqrt(Math.max(0,1-r2));
    const cp=Math.cos(V.phi*D), sp=Math.sin(V.phi*D);
    const x0=x1*cp-z1*sp, y0=y1, z0=x1*sp+z1*cp;
    const lat=Math.asin(Math.max(-1,Math.min(1,z0)))*this.R2D;
    let lng=Math.atan2(y0,x0)*this.R2D+V.lambda;
    lng=((((lng+180)%360)+360)%360)-180;
    return {lng,lat};
  }
  _limb(a,b){
    const dr=a.rx-b.rx; if(Math.abs(dr)<1e-12) return null;
    const t=a.rx/dr; if(t<0||t>1) return null;
    let ry=a.ry+t*(b.ry-a.ry), rz=a.rz+t*(b.rz-a.rz);

  async _loadData(){

      "https://media.githubusercontent.com/media/wmgeolab/geoBoundaries/9469f09/releaseData/gbOpen/KAZ/ADM1/geoBoundaries-KAZ-ADM1.geojson"

  _makeLights(){

      const visit=r=>{ rings.push(r); for(const p of r){ if(p[0]<mnx)mnx=p[0]; if(p[0]>mxx)mxx=p[0]; if(p[1]<mny)mny=p[1]; if(p[1]>mxy)mxy=p[1]; } };

  }

  // ---------- per-frame ----------
  _tick(t){
    if(!this._mounted) return;
    this._raf=requestAnimationFrame(this._tick);
    if(!this._els.svg||!this.W) return;
    this.parallax.x += ((this.parallax.tx||0)-this.parallax.x)*0.06;
    this.parallax.y += ((this.parallax.ty||0)-this.parallax.y)*0.06;

  _draw(){

    if(!this.drag.on){ V.cx += this.parallax.x*44; V.cy += this.parallax.y*24; }
    this._render();
  }

  _render(){
    const V=this.view, E=this._els;
    E.clipC.setAttribute("cx",V.cx); E.clipC.setAttribute("cy",V.cy); E.clipC.setAttribute("r",V.R);
    E.ocean.setAttribute("cx",V.cx); E.ocean.setAttribute("cy",V.cy); E.ocean.setAttribute("r",V.R);
    E.shade.setAttribute("cx",V.cx); E.shade.setAttribute("cy",V.cy); E.shade.setAttribute("r",V.R);
    E.rim.setAttribute("cx",V.cx); E.rim.setAttribute("cy",V.cy); E.rim.setAttribute("r",V.R);
    E.atmBlur.setAttribute("cx",V.cx); E.atmBlur.setAttribute("cy",V.cy); E.atmBlur.setAttribute("r",V.R+30);
    E.atmBlur2.setAttribute("cx",V.cx); E.atmBlur2.setAttribute("cy",V.cy); E.atmBlur2.setAttribute("r",V.R+6);

    if(this._worldEls){ for(const w of this._worldEls){ w.p.setAttribute("d",this._path(w.f.type,w.f.coords)); } }
    if(this._lightEls){ for(let i=0;i<this._lightPts.length;i++){ const lp=this._lightPts[i], p=this._proj(lp.lng,lp.lat), el=this._lightEls[i];
      if(p.v && p.rx>0.04){ el.setAttribute("cx",p.sx.toFixed(1)); el.setAttribute("cy",p.sy.toFixed(1)); el.style.display=""; el.setAttribute("opacity",(Math.min(1,p.rx*1.5)).toFixed(2)); }
      else el.style.display="none"; } }

    const sel=this.state.selected, hf=this.hoverFeat;
    if(this._regionEls){ for(const r of this._regionEls){
      const d=this._path(r.f.type,r.f.coords); r.lineP.setAttribute("d",d); r.fillP.setAttribute("d",d);
      const isSel=(this._branchFeat && sel!=null && this._branchFeat[sel]===r.i);
      const isHov=(hf===r.i && sel===null);
      if(isSel){ r.lineP.setAttribute("stroke","#db1f26"); r.lineP.setAttribute("stroke-width","1.9"); r.lineP.setAttribute("filter","url(#npk-glow)"); r.fillP.setAttribute("fill","rgba(219,31,38,0.16)"); }
      else if(isHov){ r.lineP.setAttribute("stroke","rgba(255,255,255,0.92)"); r.lineP.setAttribute("stroke-width","1.5"); r.lineP.setAttribute("filter","url(#npk-glow)"); r.fillP.setAttribute("fill","rgba(190,215,245,0.12)"); }
      else { r.lineP.setAttribute("stroke","rgba(202,222,248,0.52)"); r.lineP.setAttribute("stroke-width","1.05"); r.lineP.removeAttribute("filter"); r.fillP.setAttribute("fill","rgba(120,165,220,0.05)"); }
    } }

    if(this._labelEls){ for(const L of this._labelEls){ const p=this._proj(L.o.lng,L.o.lat);
      if(p.v && p.rx>0.12){ const op=Math.min(1,(p.rx-0.12)*2.2); L.el.style.display=""; L.el.setAttribute("opacity",op.toFixed(2));
        const y0=p.sy - (L.kind==="country"?(L.o.big?0:0):((L.lines.length-1)*6));
        L.el.setAttribute("transform","translate("+p.sx.toFixed(1)+","+y0.toFixed(1)+")");
      } else L.el.style.display="none"; } }

    if(this._markerEls){ const sb=this.state.selected; const hb=this.state.hovered;
      for(const me of this._markerEls){ const p=this._proj(me.b.lng,me.b.lat);
        if(p.v && p.rx>0.05){ const op=Math.min(1,p.rx*3); me.grp.style.display=""; me.grp.setAttribute("opacity",op.toFixed(2)); me.grp.setAttribute("transform","translate("+p.sx.toFixed(1)+","+p.sy.toFixed(1)+")"); me._sx=p.sx; me._sy=p.sy; me._vis=true;
          const active=(me.i===sb || me.i===hb);
          if(me.b.city){
            if(active){ me.cityOuter.setAttribute("stroke","#ffd740"); me.cityOuter.setAttribute("r","9"); me.cityInner.setAttribute("r","4"); me.cityHalo.setAttribute("fill","rgba(255,215,64,0.22)"); }
            else { me.cityOuter.setAttribute("stroke","rgba(255,196,64,0.85)"); me.cityOuter.setAttribute("r","7"); me.cityInner.setAttribute("r","3.2"); me.cityHalo.setAttribute("fill","rgba(255,196,64,0.1)"); }
          } else {
            if(active){ me.pulse.setAttribute("opacity","0.5"); me.pulse.style.animation="npkpulse 2.2s ease-out infinite"; me.halo.setAttribute("fill","rgba(219,31,38,0.28)"); me.core.setAttribute("r","5.4"); }
            else { me.pulse.style.animation="none"; me.pulse.setAttribute("opacity","0"); me.halo.setAttribute("fill","rgba(219,31,38,0.14)"); me.core.setAttribute("r","4.5"); }
          }
        } else { me.grp.style.display="none"; me._vis=false; } }
    }
  }

  // Compute centroid of a GeoJSON feature
  _centroid(f){
    let sumX=0,sumY=0,cnt=0;
    const addRing=r=>{ for(const p of r){ sumX+=p[0]; sumY+=p[1]; cnt++; } };
    if(f.type==="Polygon") f.coords.forEach(addRing);
    else if(f.type==="MultiPolygon") f.coords.forEach(p=>p.forEach(addRing));
    return cnt>0?{lng:sumX/cnt, lat:sumY/cnt}:null;
  }

  // Get screen position for info card (above region centroid)
  _cardPos(bi){
    if(!this._kz||!this._branchFeat) return {x:this.W/2, y:200};
    const fi=this._branchFeat[bi];
    let cx,cy;
    if(fi>=0){
      const ctr=this._centroid(this._kz[fi]);
      if(ctr){ const p=this._proj(ctr.lng,ctr.lat); cx=p.sx; cy=p.sy; }
    }
    if(cx==null){ const b=this.BRANCHES[bi]; const p=this._proj(b.lng,b.lat); cx=p.sx; cy=p.sy; }
    const CARD_W=300, CARD_H=240, OFFSET=50;
    let x=cx, y=cy-OFFSET-CARD_H;
    const PAD=16;
    // Keep card away from the side list (width 292 + 16 padding = 308)
    x=Math.max(CARD_W/2+PAD+308, Math.min(this.W-CARD_W/2-PAD, x));
    y=Math.max(PAD, Math.min(this.H-CARD_H-PAD, y));
    return {x,y};
  }

  renderVals(){
    const sb=this.state.selected;
    const hb=this.state.hovered;
    const displayBi = sb !== null ? sb : hb;
    const branches=this.BRANCHES.map((b,i)=>{
      const active=sb===i || (sb===null && hb===i);
      return { short:b.short, idx:i,
        chairmanShort:b.chairman||"—",
        onSelect:()=>this.selectBranch(i),
        rowBg: active?"rgba(219,31,38,0.12)":"transparent",
        rowAccent: active?"#db1f26":"transparent",
        dot: active?"#db1f26":(b.city?"rgba(255,196,64,0.9)":"rgba(255,255,255,0.55)"),
        dotGlow: active?"rgba(219,31,38,0.9)":"rgba(255,255,255,0.4)",
        nameColor: active?"#fff":"rgba(255,255,255,0.82)"
      };
    });
    const b=displayBi!=null?this.BRANCHES[displayBi]:null;
    const sel=b?{name:b.name,chairman:b.chairman||"—",email:b.email,address:b.address,phone:b.phone}:{};
    const cp=displayBi!=null?this._cardPos(displayBi):{x:this.W/2,y:200};
    return {
      globeHost:this.globeHost,
      cardRef:React.createRef(),
      branches, sel, hasSelected:!!b,
      cardX: cp.x.toFixed(0)+"px",
      cardY: cp.y.toFixed(0)+"px",
      onClose:()=>this.setState({selected:null, hovered:null}),
    };
  }
}
</script>
