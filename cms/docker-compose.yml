version: '3.9'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: npk_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-npk_cms}
      POSTGRES_USER: ${POSTGRES_USER:-npk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-npk} -d ${POSTGRES_DB:-npk_cms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── MinIO ───────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: npk_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # ─── API (Express backend) ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: npk_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Frontend (Public website) ───────────────────────────────────────────────
  frontend:
    build:
      context: ../../app
      dockerfile: Dockerfile
    container_name: npk_frontend
    restart: unless-stopped
    depends_on:
      - api

  # ─── CMS (React admin panel) ─────────────────────────────────────────────────
  cms:
    build:
      context: ./packages/cms
      dockerfile: Dockerfile
    container_name: npk_cms
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    # In production, access is restricted to VPN via nginx

  # ─── Nginx (reverse proxy) ───────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: npk_nginx
    restart: unless-stopped
    depends_on:
      - api
      - cms
      - minio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: npk_network
